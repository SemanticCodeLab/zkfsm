# Skeleton CRD for the future zkfsm operator. No controller reconciles it yet.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: zkfsmclusters.zkfsm.dev
spec:
  group: zkfsm.dev
  scope: Namespaced
  names:
    kind: ZKFSMCluster
    listKind: ZKFSMClusterList
    plural: zkfsmclusters
    singular: zkfsmcluster
    shortNames: [zkc]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
        scale:
          specReplicasPath: .spec.replicas
          statusReplicasPath: .status.readyReplicas
      additionalPrinterColumns:
        - {name: Replicas, type: integer, jsonPath: .spec.replicas}
        - {name: Ready, type: integer, jsonPath: .status.readyReplicas}
        - {name: EC, type: string, jsonPath: .status.erasureLayout}
        - {name: Phase, type: string, jsonPath: .status.phase}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [replicas, storage]
              properties:
                image:
                  type: string
                  description: Container image; defaults to the operator's release.
                replicas:
                  type: integer
                  minimum: 1
                  description: Number of zkfsm nodes.
                storage:
                  type: object
                  required: [drivesPerNode, size]
                  properties:
                    drivesPerNode:
                      type: integer
                      minimum: 1
                    size:
                      type: string
                      pattern: '^[0-9]+(\.[0-9]+)?(Ki|Mi|Gi|Ti|Pi|Ei|k|M|G|T|P|E)?$'
                      description: Capacity per drive, e.g. 100Gi.
                    storageClassName:
                      type: string
                erasure:
                  type: object
                  description: Erasure coding layout across the drives of a set.
                  x-kubernetes-validations:
                    - rule: self.parity <= self.data
                      message: parity must not exceed data shards
                  properties:
                    data:
                      type: integer
                      minimum: 1
                      default: 4
                    parity:
                      type: integer
                      minimum: 0
                      default: 2
                credentialsSecret:
                  type: string
                  description: Secret with accessKey/secretKey for the root user.
                resources:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Bootstrapping, Running, Degraded, Upgrading, Failed]
                readyReplicas:
                  type: integer
                erasureLayout:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type: {type: string}
                      status: {type: string, enum: ["True", "False", "Unknown"]}
                      reason: {type: string}
                      message: {type: string}
                      lastTransitionTime: {type: string, format: date-time}
---
# Example resource.
# apiVersion: zkfsm.dev/v1alpha1
# kind: ZKFSMCluster
# metadata: {name: demo}
# spec:
#   replicas: 4
#   storage: {drivesPerNode: 4, size: 100Gi}
#   erasure: {data: 4, parity: 2}
