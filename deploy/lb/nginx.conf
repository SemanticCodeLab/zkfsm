# nginx in front of a zkfsm cluster. Any node serves any request; failed nodes are
# skipped (passive checks) and retried on the next node for idempotent requests.
# For active health checks use HAProxy (haproxy.cfg) or nginx Plus against
# /health/ready, which returns 503 when the node cannot reach write quorum.
worker_processes auto;
events { worker_connections 4096; }

http {
    upstream zkfsm {
        least_conn;
        server zkfsm1:9000 max_fails=2 fail_timeout=10s;
        server zkfsm2:9000 max_fails=2 fail_timeout=10s;
        server zkfsm3:9000 max_fails=2 fail_timeout=10s;
        server zkfsm4:9000 max_fails=2 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 9000;
        # S3 bodies are streamed: no size limit, no buffering.
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        ignore_invalid_headers off;

        location / {
            # SigV4 signs the Host header: pass the client's value through.
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_pass http://zkfsm;
        }
    }
}
