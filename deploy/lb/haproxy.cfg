# HAProxy in front of a zkfsm cluster with active readiness checks: a node that
# cannot reach write quorum answers /health/ready with 503 and is taken out.
global
    maxconn 8192

defaults
    mode http
    timeout connect 5s
    timeout client 300s
    timeout server 300s
    option http-keep-alive
    retries 2
    option redispatch

frontend s3
    bind :9000
    default_backend zkfsm

backend zkfsm
    balance leastconn
    option httpchk GET /health/ready
    http-check expect status 200
    default-server inter 2s fall 2 rise 2
    server zkfsm1 zkfsm1:9000 check
    server zkfsm2 zkfsm2:9000 check
    server zkfsm3 zkfsm3:9000 check
    server zkfsm4 zkfsm4:9000 check
