name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: fmt
        run: zig fmt --check src build.zig
      - name: unit tests
        run: zig build test --summary all
      - name: layer check
        run: bash scripts/check_layers.sh
      - name: smoke
        run: bash tests/smoke.sh

  deploy-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: helm lint
        run: |
          helm lint helm/zkfsm
          helm lint helm/zkfsm --set drives.count=4,replicas=4,serviceMonitor.enabled=true
      - name: helm template
        run: helm template zkfsm helm/zkfsm --set drives.count=4,replicas=4 > /dev/null
      - name: compose config
        run: |
          docker compose -f deploy/compose/docker-compose.yml config -q
          docker compose -f deploy/compose/docker-compose.4drive.yml config -q
      - name: docker build
        run: docker build -t zkfsm:ci .
