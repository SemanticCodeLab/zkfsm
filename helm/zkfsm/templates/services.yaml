apiVersion: v1
kind: Service
metadata:
  name: {{ include "zkfsm.fullname" . }}-headless
  labels: {{- include "zkfsm.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {{- include "zkfsm.selectorLabels" . | nindent 4 }}
  ports:
    - name: s3
      port: {{ .Values.service.port }}
      targetPort: s3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zkfsm.fullname" . }}
  labels: {{- include "zkfsm.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "zkfsm.selectorLabels" . | nindent 4 }}
  ports:
    - name: s3
      port: {{ .Values.service.port }}
      targetPort: s3
