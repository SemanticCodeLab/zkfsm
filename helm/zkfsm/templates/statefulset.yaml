{{- $drives := int .Values.drives.count }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "zkfsm.fullname" . }}
  labels: {{- include "zkfsm.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "zkfsm.fullname" . }}-headless
  replicas: {{ .Values.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels: {{- include "zkfsm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "zkfsm.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: zkfsm
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --data
            {{- range $i := until $drives }}
            - /data{{ add $i 1 }}
            {{- end }}
            - --listen
            - 0.0.0.0:9000
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: ZKFSM_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: {{ include "zkfsm.secretName" . }}, key: accessKey}
            - name: ZKFSM_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: {{ include "zkfsm.secretName" . }}, key: secretKey}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: s3
              containerPort: 9000
          livenessProbe:
            httpGet: {path: {{ .Values.probes.liveness.path }}, port: s3}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet: {path: {{ .Values.probes.readiness.path }}, port: s3}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- range $i := until $drives }}
            - name: drive{{ add $i 1 }}
              mountPath: /data{{ add $i 1 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    {{- range $i := until $drives }}
    - metadata:
        name: drive{{ add $i 1 }}
        labels: {{- include "zkfsm.selectorLabels" $ | nindent 10 }}
      spec:
        accessModes: {{- toYaml $.Values.drives.accessModes | nindent 10 }}
        {{- if $.Values.drives.storageClass }}
        {{- if eq "-" $.Values.drives.storageClass }}
        storageClassName: ""
        {{- else }}
        storageClassName: {{ $.Values.drives.storageClass | quote }}
        {{- end }}
        {{- end }}
        resources:
          requests:
            storage: {{ $.Values.drives.size }}
    {{- end }}
