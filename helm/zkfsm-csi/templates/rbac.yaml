apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "zkfsm-csi.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zkfsm-csi.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "zkfsm-csi.fullname" . }}-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zkfsm-csi.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "zkfsm-csi.fullname" . }}-provisioner
  labels:
    {{- include "zkfsm-csi.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csinodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots", "volumesnapshotcontents"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "zkfsm-csi.fullname" . }}-provisioner
  labels:
    {{- include "zkfsm-csi.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "zkfsm-csi.fullname" . }}-controller
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "zkfsm-csi.fullname" . }}-provisioner
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "zkfsm-csi.fullname" . }}-provisioner-leader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zkfsm-csi.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "watch", "list", "delete", "update", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "zkfsm-csi.fullname" . }}-provisioner-leader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zkfsm-csi.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "zkfsm-csi.fullname" . }}-controller
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "zkfsm-csi.fullname" . }}-provisioner-leader
  apiGroup: rbac.authorization.k8s.io
