image:
  repository: ghcr.io/semanticcodelab/zkfsm-operator
  tag: ""          # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Namespace to watch; "" watches every namespace (ClusterRole).
watchNamespace: ""
# Seconds between reconcile passes.
interval: 5

resources:
  requests: {cpu: 20m, memory: 32Mi}
  limits: {memory: 128Mi}

nodeSelector: {}
tolerations: []
affinity: {}
